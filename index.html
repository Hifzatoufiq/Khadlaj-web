<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Permissions-Policy" content="unload=()" />
    <title>Khadlaj Perfumes</title>
    <meta name="description" content="Khadlaj Perfumes — Authentic Arabian & French fragrance artistry since 1997. Shop 400+ unique fragrances from UAE." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Add a cache buster parameter to force Vercel edge/browser to reload
      if(window.location.search.indexOf('v=70') === -1) {
        window.location.replace(window.location.pathname + '?v=70');
      }
    </script>
    <style>
      *{box-sizing:border-box;margin:0;padding:0;}
      html, body{overflow-x:hidden;max-width:100vw;width:100%;}
      body{background:#fff;font-family:'Montserrat',sans-serif;}
      #root{min-height:100vh;overflow-x:hidden;max-width:100vw;width:100%;}
      #preloader {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background: #fff;
        z-index: 999999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      }
      #preloader.loaded {
        opacity: 0;
        visibility: hidden;
      }
      #preloader img {
        width: 220px;
        animation: pulse 1.2s infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.7; }
        100% { transform: scale(1.05); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <img src="/assets/images/khadlaj-logo.png" alt="Khadlaj Logo Loading..." />
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML = '<div style="font-family:monospace;padding:40px;color:red;background:#fff;white-space:pre-wrap;"><h2>JS Error</h2>' + (e.message || '') + '<br><br>' + (e.filename || '') + ':' + (e.lineno || '') + '<br><br>' + (e.error && e.error.stack ? e.error.stack : '') + '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML = '<div style="font-family:monospace;padding:40px;color:red;background:#fff;white-space:pre-wrap;"><h2>Unhandled Promise Rejection</h2>' + String(e.reason) + '</div>';
      });
    </script>
    <script src="./bundle-v76.js"></script>
  </body>
</html>
