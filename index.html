<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khadlaj Perfumes</title>
    <meta name="description" content="Khadlaj Perfumes — Authentic Arabian & French fragrance artistry since 1997. Shop 400+ unique fragrances from UAE." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Cloudinary CDN preconnect (activate once cloud name is set in the JSX) -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <!-- Shopify CDN preconnect for product images -->
    <link rel="preconnect" href="https://cdn.shopify.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.shopify.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      *{box-sizing:border-box;margin:0;padding:0;}
      html, body{overflow-x:clip;max-width:100vw;width:100%;}
      body{background:#fff;font-family:'Montserrat',sans-serif;}
      #root{min-height:100vh;overflow-x:clip;max-width:100vw;width:100%;}
      #preloader {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background: #ffffff;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: transform 0.9s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease;
      }
      #preloader.loaded {
        transform: translateY(-100%);
        opacity: 0;
        pointer-events: none;
      }
      .vip-logo {
        width: 220px;
        animation: vipPulse 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        margin-bottom: 30px;
      }
      .vip-loader-bar {
        width: 160px;
        height: 1px;
        background: rgba(184, 146, 42, 0.2);
        position: relative;
        overflow: hidden;
      }
      .vip-loader-bar::after {
        content: "";
        position: absolute;
        top: 0; left: 0; height: 100%; width: 40%;
        background: #B8922A;
        animation: vipProgress 1.6s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes vipPulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.03); opacity: 1; filter: drop-shadow(0 4px 15px rgba(184,146,42,0.15)); }
      }
      @keyframes vipProgress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <img src="/assets/images/purple-logo.png?v=2" alt="Khadlaj Logo" class="vip-logo" />
      <div class="vip-loader-bar"></div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML = '<div style="font-family:monospace;padding:40px;color:red;background:#fff;white-space:pre-wrap;"><h2>JS Error</h2>' + (e.message || '') + '<br><br>' + (e.filename || '') + ':' + (e.lineno || '') + '<br><br>' + (e.error && e.error.stack ? e.error.stack : '') + '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML = '<div style="font-family:monospace;padding:40px;color:red;background:#fff;white-space:pre-wrap;"><h2>Unhandled Promise Rejection</h2>' + String(e.reason) + '</div>';
      });
    </script>
    <script src="./bundle-v208.js"></script>
  </body>
</html>
